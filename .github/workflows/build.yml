name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # cmdline-tools 7.0 是 Java 17 编译（class v61.0），必须用 JDK 17+ 跑
          # AGP 4.1.3 + JDK 17 能编译（会有 deprecation warning，无害）
          java-version: '17'
          distribution: 'temurin'

      # ⭐ 装 Android SDK（含 API 30 + build-tools 30.0.3 + 自动接受 License）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 改用 api-level（v2 时代的 android-version 已废弃）
          api-level: 30
          build-tools-version: '30.0.3'

      # 兜底：再显式接受一次 license（防止有些组件漏掉）
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 出 debug APK（不需要签名，最快能看到产物）
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 把 APK 上传成 artifact，方便下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
