// 项目级 build.gradle —— 配置所有模块共用的仓库和插件版本
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle Plugin 版本
        // 4.1.3 → 7.4.2：升级原因 — Gradle 6.8 不支持 Java 17（最高 Java 15），
        // 而 cmdline-tools 7.0 需要 Java 17 跑，所以整体升到 AGP 7.4 + Gradle 7.5
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
